services:
  - type: web
    name: fittrack-pro-php
    runtime: docker
    plan: free
    region: singapore
    branch: codex/fitness-tracking-system
    rootDir: .
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: DATABASE_URL
        # Neon pooled connection string is managed in the Render dashboard.
        # Keep it out of Git and prevent Blueprint syncs from overwriting it.
        sync: false
      - key: DEMO_BOOTSTRAP_PASSWORD
        value: Demo12345
      - key: DEMO_ADMIN_PASSWORD
        value: Admin12345
      - key: AI_API_KEY
        value: ""
      - key: AI_MODEL
        value: ""
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
