services:
  - type: web
    name: fitness-tracking-management-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitness-tracking-management-system-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""

databases:
  - name: fitness-tracking-management-system-db
    plan: free
    databaseName: fitness_tracker
    user: fitness_tracker
