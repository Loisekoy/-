services:
  - type: web
    name: fittrack-pro-php
    runtime: docker
    plan: free
    region: singapore
    rootDir: codex生成/php-app
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-pro-db
          property: connectionString
      - key: DEMO_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions

databases:
  - name: fittrack-pro-db
    plan: free
    region: singapore
    databaseName: fittrack
    user: fittrack
