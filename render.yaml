services:
  - type: web
    name: fittrack-pro-php
    runtime: docker
    plan: free
    region: singapore
    branch: codex/fitness-tracking-system
    rootDir: .
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-pro-db
          property: connectionString
      - key: DEMO_BOOTSTRAP_PASSWORD
        value: Demo12345
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: AI_API_KEY
        value: ""
      - key: AI_MODEL
        value: ""
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions

databases:
  - name: fittrack-pro-db
    plan: free
    region: singapore
    databaseName: fittrack
    user: fittrack
