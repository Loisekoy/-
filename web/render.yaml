services:
  - type: web
    name: fittrack-pro-php
    runtime: docker
    plan: free
    region: singapore
    rootDir: .
    dockerfilePath: ./web/php-app/Dockerfile
    dockerContext: ./web/php-app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: TRUSTED_PROXY_IPS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-pro-db
          property: connectionString
      - key: DEMO_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: AI_API_KEY
        value: ""
      - key: AI_MODEL
        value: ""
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions

  # Render schedules are UTC. 19:00 UTC equals 03:00 on the next day in Asia/Taipei.
  - type: cron
    name: fittrack-session-cleanup
    runtime: docker
    plan: starter
    region: singapore
    schedule: "0 19 * * *"
    rootDir: .
    dockerfilePath: ./web/php-app/Dockerfile
    dockerContext: ./web/php-app
    dockerCommand: php bin/cleanup-expired.php
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: fittrack-pro-php
          envVarKey: SECRET_KEY
      - key: RATE_LIMIT_SECRET
        fromService:
          type: web
          name: fittrack-pro-php
          envVarKey: RATE_LIMIT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-pro-db
          property: connectionString

databases:
  - name: fittrack-pro-db
    plan: free
    region: singapore
    databaseName: fittrack
    user: fittrack
