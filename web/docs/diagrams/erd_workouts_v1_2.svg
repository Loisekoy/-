  <text x="80" y="1476" class="legend">PK：Primary Key　 FK：Foreign Key　 UQ：Unique　 ?：可為 NULL　 箭頭方向：父表 → 子表</text>
  <text x="2020" y="1476" text-anchor="end" class="legend">R19–R25；場次快照與逐組紀錄形成完整歷史鏈</text>
