<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1080" viewBox="0 0 2100 1080" role="img" aria-labelledby="title desc">
  <title id="title">動作身份與不可變版本 ERD</title>
  <desc id="desc">R08–R09｜穩定動作身份與歷史版本分離</desc>
  <defs>
    <style>
      text { font-family: "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #263442; }
      .page-title { font-size: 34px; font-weight: 700; letter-spacing: 0.4px; }
      .page-subtitle { font-size: 17px; fill: #64748b; }
      .entity-title { font-size: 22px; font-weight: 700; fill: #ffffff; letter-spacing: 0.6px; }
      .entity-subtitle { font-size: 14px; fill: #e2e8f0; }
      .field { font-size: 17px; }
      .field-muted { font-size: 16px; fill: #5c6b78; }
      .key { font-family: Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; }
      .relation { fill: none; stroke: #526477; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .relation-label { font-size: 15px; font-weight: 700; fill: #334155; }
      .cardinality { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #475569; }
      .legend { font-size: 15px; fill: #5c6b78; }
      .callout-title { font-size: 17px; font-weight: 700; fill: #334155; }
      .callout-text { font-size: 15px; fill: #526477; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#526477"/>
    </marker>
  </defs>
  <rect width="2100" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="2100" height="10" fill="#334155"/>
  <text x="80" y="68" class="page-title">動作身份與不可變版本 ERD</text>
  <text x="80" y="102" class="page-subtitle">R08–R09｜穩定動作身份與歷史版本分離</text>
  <line x1="80" y1="125" x2="2020" y2="125" stroke="#cbd5e1" stroke-width="1.5"/>

  <path class="relation" d="M560 430 L770 430"/>
  <g>
    <rect x="635" y="414" width="60" height="31" rx="15.5" fill="#ffffff" stroke="#aab7c4"/>
    <text x="665" y="436" text-anchor="middle" class="relation-label">R08</text>
  </g>
  <text x="570" y="415" class="cardinality">1</text>
  <text x="720" y="415" class="cardinality">0..N</text>
  <path class="relation" d="M1250 430 L1460 430"/>
  <g>
    <rect x="1325" y="414" width="60" height="31" rx="15.5" fill="#ffffff" stroke="#aab7c4"/>
    <text x="1355" y="436" text-anchor="middle" class="relation-label">R09</text>
  </g>
  <text x="1260" y="415" class="cardinality">1</text>
  <text x="1410" y="415" class="cardinality">0..N</text>
  <g filter="url(#shadow)">
    <rect x="100" y="250" width="460" height="360" rx="16" fill="#ffffff" stroke="#9dacbb" stroke-width="1.5"/>
    <path d="M116 250 H544 Q560 250 560 266 V320 H100 V266 Q100 250 116 250 Z" fill="#53677b"/>
    <text x="130" y="286" class="entity-title">BODY_PARTS</text>
    <text x="130" y="312" class="entity-subtitle">身體部位主檔</text>
    <line x1="120" y1="339" x2="540" y2="339" stroke="#e2e8f0"/>
    <text x="130" y="384" class="key" fill="#334155">PK</text><text x="205" y="384" class="field">body_part_id</text>
    <text x="130" y="423" class="key" fill="#7c5c42">UQ</text><text x="205" y="423" class="field">body_part_name</text>
    <text x="130" y="462" class="field-muted">description?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="770" y="230" width="480" height="400" rx="16" fill="#ffffff" stroke="#5e7388" stroke-width="2.2"/>
    <path d="M786 230 H1234 Q1250 230 1250 246 V300 H770 V246 Q770 230 786 230 Z" fill="#2f4358"/>
    <text x="800" y="266" class="entity-title">EXERCISES</text>
    <text x="800" y="292" class="entity-subtitle">穩定動作身份</text>
    <line x1="790" y1="319" x2="1230" y2="319" stroke="#e2e8f0"/>
    <text x="800" y="364" class="key" fill="#334155">PK</text><text x="875" y="364" class="field">exercise_id</text>
    <text x="800" y="403" class="key" fill="#64748b">FK</text><text x="875" y="403" class="field">body_part_id</text>
    <text x="800" y="442" class="field">is_active</text>
    <text x="800" y="481" class="field-muted">created_at</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1460" y="170" width="540" height="520" rx="16" fill="#ffffff" stroke="#899aaa" stroke-width="1.8"/>
    <path d="M1476 170 H1984 Q2000 170 2000 186 V240 H1460 V186 Q1460 170 1476 170 Z" fill="#465d72"/>
    <text x="1490" y="206" class="entity-title">EXERCISE_VERSIONS</text>
    <text x="1490" y="232" class="entity-subtitle">不可變名稱、難度、說明與圖片版本</text>
    <line x1="1480" y1="259" x2="1980" y2="259" stroke="#e2e8f0"/>
    <text x="1490" y="304" class="key" fill="#334155">PK</text><text x="1565" y="304" class="field">exercise_version_id</text>
    <text x="1490" y="343" class="key" fill="#64748b">FK</text><text x="1565" y="343" class="field">exercise_id</text>
    <text x="1490" y="382" class="field">version_no</text>
    <text x="1490" y="421" class="field">exercise_name · difficulty_level</text>
    <text x="1490" y="460" class="field">equipment? · description</text>
    <text x="1490" y="499" class="field">image_url?</text>
    <text x="1490" y="538" class="field-muted">created_at</text>
    <text x="1490" y="577" class="key" fill="#7c5c42">UQ</text><text x="1565" y="577" class="field-muted">(exercise_id, version_no)</text>
  </g>
  <g>
    <rect x="570" y="760" width="960" height="112" rx="12" fill="#eef2f6" stroke="#cbd5e1"/>
    <text x="594" y="794" class="callout-title">歷史完整性設計</text>
    <text x="594" y="828" class="callout-text">EXERCISES 只代表不變的動作身份；名稱、難度、器材、說明與圖片放在版本表。</text>
    <text x="594" y="856" class="callout-text">修改動作時新增 EXERCISE_VERSIONS；已被課表或場次引用的舊版本禁止 UPDATE／DELETE。</text>
  </g>
  <line x1="80" y1="1022" x2="2020" y2="1022" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="1056" class="legend">PK：Primary Key　 FK：Foreign Key　 UQ：Unique　 ?：可為 NULL　 箭頭方向：父表 → 子表</text>
  <text x="2020" y="1056" text-anchor="end" class="legend">R08–R09；版本表保留三年前的動作顯示內容</text>
</svg>
